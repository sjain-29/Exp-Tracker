<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>PaisaPilot</title>
  <meta name="description" content="PaisaPilot: a private, fast personal finance tracker. Every Rupee, Under Control.">
  <meta name="theme-color" content="#03050B">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <meta name="format-detection" content="telephone=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PaisaPilot">
  <!-- Defence in depth: only our own scripts, Firebase endpoints and Google Fonts may load. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebasedatabase.app wss://*.firebasedatabase.app; frame-src https://*.firebaseapp.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script src="js/theme-boot.js"></script>
  <script src="vendor/chart.umd.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>

  <div id="boot" class="boot" aria-live="polite">
    <svg class="logo" width="64" height="64" viewBox="0 0 120 120" aria-hidden="true">
      <defs><linearGradient id="bootg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#2F6BFF"/><stop offset="1" stop-color="#38BDF8"/></linearGradient></defs>
      <rect width="120" height="120" rx="30" fill="#050A18"/>
      <circle cx="60" cy="60" r="42" fill="none" stroke="#16244A" stroke-width="7" stroke-linecap="round" stroke-dasharray="197.9 263.9" transform="rotate(135 60 60)"/>
      <circle class="boot-arc" cx="60" cy="60" r="42" fill="none" stroke="url(#bootg)" stroke-width="7" stroke-linecap="round" stroke-dasharray="138 263.9" transform="rotate(135 60 60)"/>
      <path d="M45 42H75M45 54H75M53 42C69 42 69 66 53 66H47L71 86" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <p class="boot-name">PaisaPilot</p>
    <noscript><p class="boot-note">PaisaPilot needs JavaScript to run.</p></noscript>
  </div>

  <div id="setup-root" hidden></div>
  <div id="auth-root" hidden></div>

  <div id="shell" class="shell" hidden>
    <aside id="sidebar" class="sidebar" aria-label="Sidebar"></aside>
    <div class="main-col">
      <header class="topbar">
        <div id="topbar-brand"></div>
        <div id="status-chip" class="status-chip" role="status" aria-live="polite" hidden></div>
      </header>
      <div id="banner" class="banner" role="status" hidden></div>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
    <button id="fab" class="fab" type="button" aria-label="Add Transaction">
      <i data-icon="plus" data-size="28"></i>
    </button>
    <nav id="bottom-nav" class="bottom-nav" aria-label="Main"></nav>
  </div>
</body>
</html>
